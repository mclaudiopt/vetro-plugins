<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="stripes" width="320" height="1080" patternUnits="userSpaceOnUse">
      <rect width="160" height="1080" fill="#0e4a2a"/><rect x="160" width="160" height="1080" fill="#0a3d22"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="0.35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#02100a" stop-opacity="0.92"/></radialGradient>
    <radialGradient id="light" cx="50%" cy="0%" r="55%"><stop offset="0" stop-color="#e6fbe9" stop-opacity="0.38"/><stop offset="1" stop-color="#e6fbe9" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#stripes)"/>
